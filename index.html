<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172554">
<link rel="manifest" href="/manifest.webmanifest">
<title>Routine Flow</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

:root {
  --bg: #f8fafc;
  --bg-gradient: linear-gradient(180deg,#eef4ff 0,#f6f9ff 44%,#eef4ff 100%);
  --navy: #172554;
  --blue: #2563eb;
  --blue2: #dbeafe;
  --card: #ffffff;
  --text: #172033;
  --muted: #64748b;
  --line: #dbe4f0;
  --green: #15803d;
  --red: #dc2626;
  --shadow: 0 12px 30px rgba(37,99,235,.10);
  --input-bg: #ffffff;
}

[data-theme="dark"] {
  --bg: #090d16;
  --bg-gradient: radial-gradient(circle at top center, #1e293b 0%, #090d16 70%);
  --navy: #0f172a;
  --blue: #3b82f6;
  --blue2: rgba(59, 130, 246, 0.12);
  --card: #0f172a;
  --text: #f8fafc;
  --muted: #94a3b8;
  --line: rgba(255, 255, 255, 0.1);
  --green: #22c55e;
  --red: #ef4444;
  --shadow: 0 12px 30px rgba(0,0,0,.4);
  --input-bg: rgba(2, 6, 23, 0.5);
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  background-image:var(--bg-gradient);
  background-attachment:fixed;
  color:var(--text);
  font-family:"DM Sans",system-ui,sans-serif;
  text-align:center;
  transition: background 0.3s ease, color 0.3s ease;
}

header{
  position:sticky;top:0;z-index:30;
  background:var(--navy);
  color:#fff;
  border-bottom:1px solid rgba(255,255,255,.12);
  box-shadow:0 5px 18px rgba(23,37,84,.18);
}

header .inner{
  max-width:820px;margin:auto;padding:18px 20px;
  display:flex;align-items:center;justify-content:space-between;
}

h1,h2,h3,.tasktitle,.runnerTitle{
  font-family:"Space Grotesk",sans-serif;
}

h1{margin:0;font-size:26px;letter-spacing:-.4px}

main{max-width:820px;margin:0 auto;padding:16px 16px 70px}

section,.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow);
  margin:16px 0;
  padding:20px;
  text-align:left;
}

section>h2,.card>h2{
  margin:0 0 16px;
  color:var(--navy);
  font-size:20px;
  text-align:center;
}

label{
  display:block;
  font-weight:600;
  margin:12px 0 7px;
  color:var(--muted);
}

input,select,button{
  font:inherit;
}

input,select{
  width:100%;
  border:1px solid #cbd5e1;
  border-radius:11px;
  padding:11px 12px;
  background:var(--input-bg);
  color:var(--text);
  text-align:center;
  outline:none;
}

input:focus,select:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

button{
  border:0;border-radius:11px;
  padding:10px 15px;
  font-weight:700;
  cursor:pointer;
  transition:.18s ease;
}

button:hover{transform:translateY(-1px)}

.primary,.startBtn{
  background:var(--blue);color:#fff;
  box-shadow:0 5px 12px rgba(37,99,235,.18);
}
.secondary{
  background:var(--blue2);color:var(--blue);
}
.danger{background:#fee2e2;color:var(--red)}
.success{background:#dcfce7;color:var(--green)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}

#taskList{
  display:flex;flex-direction:column;gap:12px;
}

.task{
  position:relative;
  display:grid;
  grid-template-columns:32px 50px minmax(0,1fr) auto;
  align-items:center;
  gap:13px;
  padding:14px 14px 14px 10px;
  background:var(--input-bg);
  border:1px solid var(--line);
  border-radius:16px;
  text-align:left;
  box-shadow:0 3px 12px rgba(15,23,42,.055);
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
  overflow:hidden;
}

.task::before{
  content:"";
  position:absolute;
  left:0;top:10px;bottom:10px;
  width:3px;
  border-radius:0 4px 4px 0;
  background:#cbd5e1;
}

.task:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 22px rgba(15,23,42,.09);
  border-color:#d5def0;
}

.task.dragging{
  opacity:.72;
  transform:scale(1.025) rotate(.25deg);
  z-index:20;
  box-shadow:0 16px 34px rgba(15,23,42,.16);
}

.task.drop-target{
  border-color:#93c5fd;
  box-shadow:0 0 0 3px rgba(37,99,235,.10);
  transform:translateY(-3px);
}

.task.active{
  border-color:#93c5fd;
  box-shadow:0 8px 24px rgba(37,99,235,.12);
}
.task.active::before{background:var(--blue)}
.task.completed::before{background:#86efac}

.handle{
  width:28px;height:38px;
  display:grid;place-items:center;
  color:#94a3b8;
  font-size:17px;
  border-radius:9px;
  cursor:grab;
  user-select:none;
  touch-action:none;
}
.handle:active{cursor:grabbing}

.icon{
  width:48px;height:48px;
  display:grid;place-items:center;
  background:linear-gradient(145deg,#eff6ff,#dbeafe);
  border:1px solid #dbeafe;
  border-radius:13px;
  font-size:24px;
}

.tasktitle{
  font-size:18px;
  font-weight:700;
  line-height:1.25;
  color:var(--text);
  text-align:left;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:6px;
  font-size:14px;
  color:var(--muted);
  margin-top:7px;
  line-height:1.3;
  text-align:left;
}

.meta .pill{
  display:inline-flex;
  align-items:center;
  padding:4px 8px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:999px;
  white-space:nowrap;
}

.meta .donepill{
  background:#f0fdf4;
  color:#4d7c5a;
  font-weight:700;
}
.meta .duepill{
  background:#fee2e2;
  color:#dc2626;
  font-weight:800;
}
.earlypill{background:#f0fdf4;color:#4d7c5a;border:1px solid #dcfce7;font-weight:700}

.actions{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:7px;
  flex-shrink:0;
}

.actions button{
  width:38px;height:38px;min-width:38px;
  padding:0;
  display:grid;place-items:center;
  border-radius:10px;
  font-size:16px;
  box-shadow:none;
}

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.summary .box{
  background:var(--navy);
  color:#fff;
  border-radius:14px;
  padding:14px 10px;
}

.summary .value{
  display:block;
  font-family:"Space Grotesk",sans-serif;
  font-size:20px;font-weight:700;
  margin-top:4px;
}

.summary .label{
  margin:0;color:#bfdbfe;font-size:12px;font-weight:600;
}

.runner{
  position:sticky;
  top:78px;
  z-index:20;
  background:linear-gradient(135deg,#172554 0%,#1e3a8a 100%);
  color:#fff;
  border:1px solid rgba(255,255,255,.18);
  border-radius:18px;
  box-shadow:0 10px 28px rgba(23,37,84,.24);
  padding:16px 15px;
  margin:16px 0;
}

.runner .current{font-family:"Space Grotesk",sans-serif;font-size:18px;font-weight:700;margin-bottom:3px}
.runner .big{
  font-family:"Space Grotesk",sans-serif;
  font-size:58px !important;
  line-height:1.05;
  font-weight:800;
  letter-spacing:1px;
  margin:5px 0 7px;
}
.runner .end{font-size:13px;color:#bfdbfe}
.runner .row{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin-top:11px}
.runner input{width:78px;padding:9px 7px;background:#fff;color:#172033}

.modal{
  position:fixed;inset:0;background:rgba(0,0,0,0.5);
  backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;
}
.modal.show{display:flex}
.modalbox{
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:24px;width:100%;max-width:400px;position:relative;box-shadow:var(--shadow);
}
.modal-close{
  position:absolute;top:10px;right:10px;width:36px;height:36px;padding:0;border-radius:50%;font-size:24px;line-height:1;background:#f1f5f9;color:#334155;cursor:pointer;
}

.small{font-size:12px;color:var(--muted);margin-top:5px}
.time-setting-row{display:flex;align-items:center;gap:8px;margin-top:14px}
</style>
</head>
<body data-theme="dark">

<header>
  <div class="inner">
    <h1>Routine Flow</h1>
    <button class="secondary" onclick="toggleTheme()" id="themeToggleBtn" style="width:38px; height:38px; padding:0; border-radius:10px;">☀️</button>
  </div>
</header>

<main>
<section class="runner floating" id="runner" style="display:none">
  <div class="current" id="runTask">—</div>
  <div class="big" id="clock">00:00:00</div>
  <div class="end" id="runEnd">—</div>
  <div class="row" style="justify-content:center">
    <button onclick="togglePause()" id="pauseBtn" class="secondary" style="color:#fff; background:rgba(255,255,255,0.1)">Pause</button>
    <button class="secondary" onclick="interruptTask()" style="color:#fff; background:rgba(255,255,255,0.1)">↪ Switch task</button>
    <div style="display:flex; align-items:center; gap:6px;"><input id="adjustMinutes" type="number" value="5" step="1"><button class="secondary" onclick="adjustTime()" style="color:#fff; background:rgba(255,255,255,0.1)">Adjust</button></div>
    <button class="success" onclick="doneTask()">✓ Done</button>
    <button class="secondary" onclick="skipTask()" style="color:#fff; background:rgba(255,255,255,0.1)">Skip</button>
    <button class="danger" onclick="stopRoutine()">Stop</button>
  </div>
</section>

<section class="card">
  <div class="label">Add Task</div>
  <div class="row" style="display:flex; gap:8px; align-items:center; margin-top:8px;">
    <input id="taskEmoji" value="📝" maxlength="4" style="width:60px">
    <input id="taskName" placeholder="Task name" style="flex:1">
    <input id="taskHours" type="number" min="0" value="0" placeholder="Hrs" style="width:70px">
    <input id="taskMinutes" type="number" min="0" max="59" value="15" placeholder="Min" style="width:70px">
    <button type="button" class="primary" onclick="addTask()">Add</button>
  </div>
</section>

<section class="card">
  <div class="label">Saved task lists</div>
  <div class="row" style="display:flex; gap:8px; margin-top:8px;">
    <input id="listName" placeholder="List name (e.g. Workday)" style="flex:1">
    <button type="button" class="secondary" onclick="saveTaskList()">Save current</button>
  </div>
  <div class="row" style="display:flex; gap:8px; margin-top:9px; flex-wrap:wrap">
    <select id="savedListSelect" style="flex:1; min-width:160px;"><option value="">Select a saved list</option></select>
    <button class="secondary" type="button" onclick="loadTaskList()">Load</button>
    <button class="primary" type="button" id="saveLoadedListBtn" onclick="saveLoadedTaskList()" disabled>Save changes</button>
    <button class="danger" type="button" id="deleteSavedListBtn" onclick="deleteTaskList()">Delete</button>
  </div>
</section>

<section class="card">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <div><div class="label" style="margin:0">Routine times</div><div class="small">Start and end time are optional.</div></div>
    <button class="secondary" type="button" onclick="openTimeSettings()" style="width:38px; height:38px; padding:0; border-radius:10px;">⚙️</button>
  </div>
  <div class="time-setting-row">
    <div style="flex:1"><div class="small" style="margin-bottom:5px">Start time</div><input id="startTime" type="time" onchange="saveStart()"></div>
    <div style="flex:1"><div class="small" style="margin-bottom:5px">End time</div><input id="endTime" type="time" onchange="saveEnd()"></div>
  </div>
</section>

<section class="card">
  <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap">
    <div><b>Your routine</b></div>
    <div style="display:flex; gap:7px;">
      <button class="secondary" type="button" onclick="clearDone()">Reset status</button>
      <button class="danger" type="button" id="removeAllTasksBtn" onclick="resetTaskList()">Clear all</button>
    </div>
  </div>
  <hr style="border:0; border-top:1px solid var(--line); margin:14px 0;">
  <div id="tasks" style="display:flex; flex-direction:column; gap:12px;"></div>
  <div id="empty" class="small" style="padding:12px 2px; display:none">No tasks yet.</div>
  
  <div class="summary" style="margin-top:14px">
    <div class="box"><span class="label">Tasks</span><span class="value" id="count">0</span></div>
    <div class="box"><span class="label">Total</span><span class="value" id="total">0 min</span></div>
    <div class="box"><span class="label">Routine End</span><span class="value" id="end">—</span></div>
  </div>
  <div style="margin-top:14px"><button class="startBtn" type="button" style="width:100%; font-size:16px" onclick="startRoutine()">▶ Start routine</button></div>
</section>
</main>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modalbox">
    <h3 style="margin:0 0 14px; color:var(--navy);">Edit Task</h3>
    <div style="display:flex; gap:8px;">
      <input id="editEmoji" style="width:60px;" maxlength="4">
      <input id="editName" placeholder="Task name" style="flex:1">
    </div>
    <div style="display:flex; gap:8px; margin-top:10px;">
      <input id="editHours" type="number" min="0" placeholder="Hrs">
      <input id="editMinutes" type="number" min="0" max="59" placeholder="Min">
    </div>
    <div style="display:flex; gap:8px; margin-top:16px;">
      <button class="primary" style="flex:1" onclick="applyEdit()">Save</button>
      <button class="secondary" onclick="closeModal()">Cancel</button>
    </div>
    <button class="modal-close" type="button" onclick="closeModal()">×</button>
  </div>
</div>

<div class="modal" id="timeModal" onclick="if(event.target===this)closeTimeSettings()">
  <div class="modalbox">
    <button class="modal-close" type="button" onclick="closeTimeSettings()">×</button>
    <h2 style="margin:0 0 16px">Routine times</h2>
    <label>Start time</label>
    <input id="settingsStartTime" type="time">
    <label style="margin-top:10px">End time</label>
    <input id="settingsEndTime" type="time">
    <button class="primary" style="width:100%; margin-top:16px;" onclick="closeTimeSettings()">Done</button>
  </div>
</div>

<script>
const KEY="routine_flow_clean_v4";
const SAVED_LISTS_KEY="routine_flow_saved_clean_v4";
const SAVED_DB_NAME="RoutineFlowCleanDB_v4";
const SAVED_DB_STORE="savedLists";

function openSavedDB(){
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB){reject(new Error("IndexedDB unavailable"));return;}
    const req=indexedDB.open(SAVED_DB_NAME,1);
    req.onupgradeneeded=()=>{try{if(!req.result.objectStoreNames.contains(SAVED_DB_STORE))req.result.createObjectStore(SAVED_DB_STORE);}catch(e){}};
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error||new Error("IndexedDB open failed"));
  });
}
function writeSavedListsDB(data){
  return openSavedDB().then(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(SAVED_DB_STORE,"readwrite"),store=tx.objectStore(SAVED_DB_STORE);
    store.put(data,"all");
    tx.oncomplete=()=>{db.close();resolve(true)};
    tx.onerror=()=>{db.close();reject(tx.error||new Error("IndexedDB write failed"))};
  }));
}
function readSavedListsDB(){
  return openSavedDB().then(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(SAVED_DB_STORE,"readonly"),req=tx.objectStore(SAVED_DB_STORE).get("all");
    req.onsuccess=()=>{const v=req.result;db.close();resolve(v&&typeof v==="object"&&!Array.isArray(v)?v:{})};
    req.onerror=()=>{db.close();reject(req.error||new Error("IndexedDB read failed"))};
  }));
}

let state=JSON.parse(localStorage.getItem(KEY)||"null")||{tasks:[],startTime:"",endTime:"",routineStart:0,running:false,index:0,remaining:0,paused:false,baseEnd:0,timeline:[],interruptStack:[],savedLists:{},runOrder:[],theme:"dark"};
if(!state.savedLists || typeof state.savedLists!=="object" || Array.isArray(state.savedLists)) state.savedLists={};

state.tasks=(state.tasks||[]).map(t=>({
  ...t,
  name:t.name||"Task",
  duration:Math.max(1,Number(t.duration)||1),
  allocatedDuration:Number.isFinite(Number(t.allocatedDuration)) ? Math.max(1,Number(t.allocatedDuration)) : Math.max(1,Number(t.duration)||1),
  done:!!t.done,
  emoji:t.emoji||"📝",
  actualDuration:Number.isFinite(Number(t.actualDuration)) ? Math.max(0,Number(t.actualDuration)) : null,
  dueMinutes:Number.isFinite(Number(t.dueMinutes)) ? Math.max(0,Number(t.dueMinutes)) : 0,
  actualStart:Number.isFinite(Number(t.actualStart)) ? Number(t.actualStart) : null,
  actualEnd:Number.isFinite(Number(t.actualEnd)) ? Number(t.actualEnd) : null,
  earlyMinutes:Number.isFinite(Number(t.earlyMinutes)) ? Math.max(0,Number(t.earlyMinutes)) : 0
}));
if(typeof state.routineStart!=="number")state.routineStart=0;
if(!Array.isArray(state.timeline))state.timeline=[];
if(!Array.isArray(state.interruptStack))state.interruptStack=[];
state.taskRemaining={};
let timer=null, editIndex=-1, dragIndex=-1;
state.endTime=state.endTime||"";
state.runOrder=Array.isArray(state.runOrder)&&state.runOrder.length===state.tasks.length?state.runOrder.slice():state.tasks.map((_,i)=>i);

function setTheme(theme){
  state.theme=theme;
  document.body.setAttribute("data-theme", theme);
  const btn=document.getElementById("themeToggleBtn");
  if(btn) btn.textContent = theme==="dark" ? "☀️" : "🌙";
  persist();
}
function toggleTheme(){
  setTheme(state.theme==="dark" ? "light" : "dark");
}

function persist(){
  try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){}
}
function fmtDur(m){
  m=Math.max(0,Math.round(m)); let h=Math.floor(m/60), min=m%60;
  if(h&&min)return `${h} hr ${min} min`; if(h)return `${h} hr`; return `${min} min`;
}
function clock(sec){
  sec=Math.round(sec); let neg=sec<0; sec=Math.abs(sec);
  let h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  return `${neg?"-":""}${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}
function timeLabel(date){return date.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}

function syncActiveIndex(){
  if(!state.running || !state.tasks.length) return;
  if(state.activeTaskId){
    const found=state.tasks.findIndex(t=>t._id===state.activeTaskId);
    if(found>=0) state.index=found;
  }
}

function taskTimeLabel(t,sch,i){
  const live=(state.running && Array.isArray(state.timeline) && state.timeline.length===state.tasks.length)?state.timeline:null;
  const fallback=Date.now();
  const slot=(live && live[i]) || sch[i] || {s:fallback,e:fallback + Math.max(1,Number(t.allocatedDuration||t.duration)||1)*60000};
  return `${timeLabel(new Date(slot.s))} – ${timeLabel(new Date(slot.e))}`;
}

function buildTimeline(start){
  const sch=schedule();
  if(sch.length)return sch.map(x=>({s:x.s,e:x.e,minutes:x.minutes}));
  let t=start,arr=[];
  state.tasks.forEach(task=>{
    const d=Math.max(1,Number(task.allocatedDuration||task.duration)||1);
    const e=t+d*60000;
    arr.push({s:t,e,minutes:d});t=e;
  });
  return arr;
}

function rebuildFuture(fromIndex, cursor){
  if(!Array.isArray(state.timeline)||state.timeline.length!==state.tasks.length){
    state.timeline=buildTimeline(state.routineStart||Date.now());
  }
  for(let i=fromIndex;i<state.tasks.length;i++){
    if(state.tasks[i].done)continue;
    const d=Math.max(1,Number(state.tasks[i].allocatedDuration||state.tasks[i].duration)||1);
    state.timeline[i]={s:cursor,e:cursor+d*60000,taskRef:state.tasks[i]._id};
    cursor=state.timeline[i].e;
  }
}

function shiftAllFutureTaskStartTimes(now){
  syncActiveIndex();
  if(!state.running || state.index<0)return;
  if(!Array.isArray(state.timeline)||state.timeline.length!==state.tasks.length){
    state.timeline=buildTimeline(state.routineStart||now);
  }
  state.timeline[state.index].e=now;
  rebuildFuture(state.index+1,now);
}

function schedule(){
  const n=state.tasks.length;
  if(!n)return [];
  const planned=state.tasks.map(t=>Math.max(1,Number(t.allocatedDuration||t.duration)||1));
  if(state.endTime){
    const now=new Date();
    const [eh,emi]=state.endTime.split(":").map(Number);
    const target=new Date(now);
    target.setHours(eh||0,emi||0,0,0);
    if(target.getTime()<=now.getTime()) target.setDate(target.getDate()+1);
    const totalMinutes=planned.reduce((a,b)=>a+b,0);
    let cursor=target.getTime()-totalMinutes*60000;
    const arr=[];
    planned.forEach(minutes=>{
      const e=cursor+minutes*60000;
      arr.push({s:cursor,e,minutes});
      cursor=e;
    });
    return arr;
  }
  let start = state.routineStart || (state.startTime ? (() => {
    let now=new Date(), [h,mi]=state.startTime.split(":").map(Number);
    now.setHours(h||0,mi||0,0,0);
    return now.getTime();
  })() : Date.now());

  let cursor=start, arr=[];
  planned.forEach(minutes=>{
    const e=cursor+minutes*60000;
    arr.push({s:cursor,e,minutes});
    cursor=e;
  });
  return arr;
}

function moveTaskAnimated(from,to){
  if(from<0 || to<0 || from>=state.tasks.length || to>=state.tasks.length || from===to)return;
  const x=state.tasks.splice(from,1)[0];
  state.tasks.splice(to,0,x);
  
  if(state.running && Array.isArray(state.timeline)){
    syncActiveIndex();
    const activeTask = state.tasks[state.index];
    const activeTimelineEntry = state.timeline.find(t => t && t.taskRef === activeTask._id) || state.timeline[state.index];
    
    let newTimeline = new Array(state.tasks.length);
    
    newTimeline[state.index] = {
      s: activeTimelineEntry.s,
      e: activeTimelineEntry.e,
      taskRef: activeTask._id
    };
    
    let cursor = activeTimelineEntry.e;
    for(let i = state.index + 1; i < state.tasks.length; i++){
      const task = state.tasks[i];
      if(task.done){
        const existing = state.timeline.find(t => t && t.taskRef === task._id) || {s: cursor, e: cursor + Math.max(1, Number(task.duration||1))*60000, taskRef: task._id};
        newTimeline[i] = existing;
        cursor = existing.e;
      } else {
        const d = Math.max(1, Number(task.allocatedDuration||task.duration)||1);
        newTimeline[i] = {s: cursor, e: cursor + d*60000, taskRef: task._id};
        cursor = newTimeline[i].e;
      }
    }
    
    let pastCursor = state.routineStart || (activeTimelineEntry.s - 60000);
    for(let i = 0; i < state.index; i++){
      const task = state.tasks[i];
      const existing = state.timeline.find(t => t && t.taskRef === task._id) || {s: pastCursor, e: pastCursor + Math.max(1, Number(task.duration||1))*60000, taskRef: task._id};
      newTimeline[i] = existing;
      pastCursor = existing.e;
    }
    
    state.timeline = newTimeline;
  }
  
  persist();
  render();
}

function render(){
  state.tasks.forEach(t=>{ if(!t._id) t._id="task_"+Math.random().toString(36).slice(2,8); });
  syncActiveIndex();
  document.getElementById("startTime").value=state.startTime||"";
  if(document.getElementById("endTime"))document.getElementById("endTime").value=state.endTime||"";
  let box=document.getElementById("tasks"); box.innerHTML="";
  document.getElementById("empty").style.display=state.tasks.length?"none":"block";
  let sch=schedule();
  state.tasks.forEach((t,i)=>{
    let el=document.createElement("div");
    const running=state.running && state.index===i && !state.paused;
    const due=(t.done && Number(t.dueMinutes||0)>0) ? Number(t.dueMinutes) : 0;
    const early=(t.done && Number(t.earlyMinutes||0)>0) ? Number(t.earlyMinutes) : 0;
    const status=t.done
      ? (due>0 ? `<span class="pill duepill">✓ Completed • +${due}m overtime</span>` : early>0 ? `<span class="pill earlypill">✓ Completed • ${early}m early</span>` : '<span class="pill donepill">✓ Completed</span>')
      : (running ? '<span class="pill" style="border-color:var(--blue); color:var(--blue);">● Running</span>' : '');

    el.className=`task${state.running && state.index===i ? " active" : ""}${t.done ? " completed" : ""}`;
    el.draggable=true; el.dataset.i=i; el.dataset.taskId=t._id;
    el.innerHTML=`
      <div class="handle" title="Drag to reorder">☰</div>
      <div><div class="icon">${escapeHtml(t.emoji)}</div></div>
      <div>
        <div class="tasktitle">${escapeHtml(t.name)}</div>
        <div class="meta">
          <span class="pill">Duration ${fmtDur(t.allocatedDuration||t.duration)}</span>
          <span class="pill">◷ ${taskTimeLabel(t,sch,i)}</span>
          ${status}
        </div>
      </div>
      <div class="actions">
        <button class="primary" onclick="startTask(${i})" title="Start">▶</button>
        <button class="secondary" onclick="edit(${i})" title="Edit">✎</button>
        <button class="danger" onclick="removeTask(${i})" title="Delete">⌫</button>
      </div>`;

    el.addEventListener("dragstart",e=>{ dragIndex=i; el.classList.add("dragging"); });
    el.addEventListener("dragend",()=>{ dragIndex=-1; el.classList.remove("dragging"); document.querySelectorAll(".task").forEach(x=>x.classList.remove("drop-target")); });
    el.addEventListener("dragover",e=>{ e.preventDefault(); if(dragIndex>=0 && dragIndex!==i) el.classList.add("drop-target"); });
    el.addEventListener("dragleave",()=>el.classList.remove("drop-target"));
    el.addEventListener("drop",e=>{
      e.preventDefault();
      el.classList.remove("drop-target");
      let from=dragIndex;
      if(from<0 || from===i) return;
      moveTaskAnimated(from,i);
    });

    const handle=el.querySelector(".handle");
    let touchDragging=false, touchPointerId=null;
    if(handle){
      handle.addEventListener("pointerdown",e=>{
        if(e.pointerType==="mouse") return;
        e.preventDefault(); e.stopPropagation();
        touchDragging=true; touchPointerId=e.pointerId;
        dragIndex=Number(el.dataset.i);
        el.classList.add("dragging");
        try{handle.setPointerCapture(e.pointerId)}catch(_){}
      });
      handle.addEventListener("pointermove",e=>{
        if(!touchDragging || e.pointerId!==touchPointerId) return;
        e.preventDefault();
        const nodes=[...box.querySelectorAll(".task")];
        const current=nodes.findIndex(n=>n.classList.contains("dragging"));
        if(current<0) return;
        const target=(document.elementFromPoint(e.clientX,e.clientY)||{}).closest?.(".task");
        if(!target || target.parentElement!==box || target===el) return;
        const targetIndex=nodes.indexOf(target);
        if(targetIndex<0 || targetIndex===current) return;
        const targetRect=target.getBoundingClientRect();
        const insertAfter=e.clientY > (targetRect.top + targetRect.height/2);
        let newIndex=targetIndex + (insertAfter ? 1 : 0);
        if(newIndex>current) newIndex--;
        if(newIndex<0) newIndex=0;
        if(newIndex>=nodes.length) newIndex=nodes.length-1;
        if(newIndex===current) return;
        moveTaskAnimated(current, newIndex);
        dragIndex=newIndex;
      });
      const finishTouch=e=>{
        if(!touchDragging || e.pointerId!==touchPointerId) return;
        touchDragging=false;
        try{handle.releasePointerCapture?.(touchPointerId)}catch(_){}
        dragIndex=-1;
        document.querySelectorAll(".task").forEach(x=>{x.classList.remove("dragging");x.classList.remove("drop-target");});
        persist(); render();
      };
      handle.addEventListener("pointerup",finishTouch);
      handle.addEventListener("pointercancel",finishTouch);
    }

    box.appendChild(el);
  });
  let total=state.tasks.reduce((a,t)=>a+Math.max(1,Number(t.allocatedDuration||t.duration)||1),0), sch2=schedule();
  document.getElementById("count").textContent=state.tasks.length;
  document.getElementById("total").textContent=fmtDur(total);
  const endEl=document.getElementById("end");
  if(endEl){
    const live=(state.running && Array.isArray(state.timeline) && state.timeline.length===state.tasks.length)?state.timeline:null;
    const lastEnd = live && live.length ? live[live.length-1].e : (sch2.length ? sch2[sch2.length-1].e : null);
    endEl.textContent = lastEnd != null ? timeLabel(new Date(lastEnd)) : "—";
  }
}

function escapeHtml(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function getDuration(hId,mId){
  let h=Math.max(0,parseInt(document.getElementById(hId).value||0)),m=Math.max(0,Math.min(59,parseInt(document.getElementById(mId).value||0)));
  return h*60+m;
}
function addTask(){
  let name=document.getElementById("taskName").value.trim(),dur=getDuration("taskHours","taskMinutes"),emoji=document.getElementById("taskEmoji").value.trim()||"📝";
  if(!name)return alert("Please enter a task name.");
  if(dur<1)return alert("Duration must be at least 1 minute.");
  state.tasks.push({name,duration:dur,allocatedDuration:dur,done:false,emoji,actualDuration:null,dueMinutes:0,earlyMinutes:0,actualStart:null,actualEnd:null});
  persist();
  document.getElementById("taskName").value=""; document.getElementById("taskHours").value=0; document.getElementById("taskMinutes").value=15;
  render();
}
function openTimeSettings(){
  document.getElementById("settingsStartTime").value=state.startTime||"";
  document.getElementById("settingsEndTime").value=state.endTime||"";
  document.getElementById("timeModal").style.display="flex";
}
function closeTimeSettings(){
  document.getElementById("timeModal").style.display="none";
  render();
}
function saveStart(){state.startTime=document.getElementById("startTime").value;persist();render()}
function saveEnd(){state.endTime=document.getElementById("endTime").value;persist();render()}
function removeTask(i){if(confirm("Delete this task?")){state.tasks.splice(i,1);persist();render()}}
function resetTaskList(){
  clearInterval(timer); timer=null;
  state.tasks=[]; state.startTime=""; state.endTime=""; state.routineStart=0; state.running=false; state.paused=false; state.index=0; state.remaining=0; state.baseEnd=0; state.timeline=[]; state.taskRemaining={}; state.interruptStack=[]; state.runOrder=[]; state.activeTaskId=null;
  persist(); document.getElementById("runner").style.display="none"; render();
}
function clearDone(){
  if(!state.tasks.length)return;
  clearInterval(timer); timer=null; state.running=false; state.paused=false; state.activeTaskId=null;
  state.tasks.forEach(t=>{ t.done=false; t.actualDuration=null; t.dueMinutes=0; t.earlyMinutes=0; t.actualStart=null; t.actualEnd=null; });
  persist(); document.getElementById("runner").style.display="none"; render();
}
function getSavedLists(){ return state.savedLists||{}; }
function saveSavedLists(x){
  state.savedLists=x; persist();
  writeSavedListsDB(x).catch(()=>{});
}
function populateSavedLists(){
  const select=document.getElementById("savedListSelect"); if(!select)return;
  const lists=getSavedLists(), current=select.value;
  select.innerHTML='<option value="">Select a saved list</option>';
  Object.keys(lists).sort().forEach(name=>{
    const o=document.createElement("option"); o.value=name; o.textContent=name; select.appendChild(o);
  });
  if(lists[current]) select.value=current;
  document.getElementById("saveLoadedListBtn").disabled=!select.value;
}
function saveTaskList(){
  const input=document.getElementById("listName"), name=input.value.trim();
  if(!name)return alert("Enter a name for this task list.");
  if(!state.tasks.length)return alert("Add at least one task before saving.");
  const lists=getSavedLists();
  lists[name]={startTime:state.startTime, endTime:state.endTime, tasks:JSON.parse(JSON.stringify(state.tasks))};
  saveSavedLists(lists);
  populateSavedLists();
  input.value="";
  alert(`Task list "${name}" saved.`);
}
function saveLoadedTaskList(){
  const name=document.getElementById("savedListSelect").value;
  if(!name)return;
  const lists=getSavedLists();
  lists[name]={startTime:state.startTime, endTime:state.endTime, tasks:JSON.parse(JSON.stringify(state.tasks))};
  saveSavedLists(lists);
  alert(`Changes to "${name}" saved.`);
}
function loadTaskList(){
  const name=document.getElementById("savedListSelect").value;
  if(!name)return alert("Select a saved task list first.");
  const saved=getSavedLists()[name];
  if(!saved)return;
  state.startTime=saved.startTime||""; state.endTime=saved.endTime||"";
  state.tasks=saved.tasks.map(t=>({
    ...t, _id:"task_"+Math.random().toString(36).slice(2,8)
  }));
  state.running=false; state.activeTaskId=null; persist(); render();
}
function deleteTaskList(){
  const name=document.getElementById("savedListSelect").value;
  if(!name)return alert("Select a saved list first.");
  const lists=getSavedLists();
  delete lists[name];
  saveSavedLists(lists);
  populateSavedLists();
}
function edit(i){
  editIndex=i; let t=state.tasks[i];
  document.getElementById("editEmoji").value=t.emoji||"📝";
  document.getElementById("editName").value=t.name;
  document.getElementById("editHours").value=Math.floor(t.duration/60);
  document.getElementById("editMinutes").value=t.duration%60;
  document.getElementById("modal").classList.add("show");
}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function applyEdit(){
  if(editIndex<0)return;
  let i=editIndex, t=state.tasks[i];
  let n=document.getElementById("editName").value.trim();
  let d=getDuration("editHours","editMinutes");
  let e=document.getElementById("editEmoji").value.trim()||"📝";
  if(!n||d<1)return alert("Enter a task name and a duration of at least 1 minute.");
  
  let oldDuration=t.duration;
  let deltaMinutes=d-oldDuration;
  state.tasks[i]={...t, name:n, duration:d, allocatedDuration:d, emoji:e};

  syncActiveIndex();
  if(state.running){
    if(!Array.isArray(state.timeline)||state.timeline.length!==state.tasks.length){
      state.timeline=buildTimeline(state.routineStart||Date.now());
    }
    if(i===state.index){
      if(!state.paused){
        state.timeline[i].e += deltaMinutes*60000;
        state.baseEnd=state.timeline[i].e;
        state.remaining=Math.max(0,Math.round((state.baseEnd-Date.now())/1000));
        rebuildFuture(i+1,state.timeline[i].e);
      }else{
        state.remaining=Math.max(1,state.remaining + deltaMinutes*60);
        state.timeline[i].e=state.timeline[i].s+state.remaining*1000;
        rebuildFuture(i+1,state.timeline[i].e);
      }
    }else if(i>state.index && !state.tasks[i].done){
      let cursor=state.timeline[i].s;
      state.timeline[i].e=cursor+d*60000;
      rebuildFuture(i+1,state.timeline[i].e);
    }
  }

  persist(); closeModal(); render();
  if(state.running) showRunner();
}
function startTask(i){
  const t=state.tasks[i];
  if(!t || t.done)return;
  const now=Date.now();
  if(!state.taskRemaining) state.taskRemaining={};

  if(!state.running){
    state.running=true;
    state.paused=false;
    state.routineStart=now;
    state.index=i;
    state.activeTaskId=t._id;
    state.runOrder=state.tasks.map((_,idx)=>idx);
    state.runOrder.splice(state.runOrder.indexOf(i),1);
    state.runOrder.unshift(i);
    state.tasks[i].actualStart=now;
    state.tasks[i].actualEnd=null;
    state.taskRemaining[i]=t.duration*60;
    state.timeline=[];
    let cursor=now;
    state.runOrder.forEach(idx=>{
      const mins=(idx===i || !Object.prototype.hasOwnProperty.call(state.taskRemaining,idx))
        ? Math.max(1,Number(state.tasks[idx].duration)||1)
        : Math.max(1,state.taskRemaining[idx]/60);
      state.timeline[idx]={s:cursor,e:cursor+mins*60000,taskRef:state.tasks[idx]._id};
      cursor=state.timeline[idx].e;
    });
    state.remaining=state.taskRemaining[i];
    state.baseEnd=state.timeline[i].e;
  } else {
    syncActiveIndex();
    
    // Guard against repeated play clicks adding time / re-triggering mid-run states unnecessarily
    if(state.index === i){
      if(state.paused){
        state.paused = false;
        document.getElementById("pauseBtn").textContent = "Pause";
        state.baseEnd = Date.now() + state.remaining * 1000;
      }
      persist(); render(); showRunner();
      if(!timer) timer = setInterval(tick, 250);
      tick();
      return;
    }

    if(!state.paused){
      state.remaining=Math.max(0,Math.round((state.baseEnd-now)/1000));
      state.taskRemaining[state.index]=state.remaining;
    }

    const current=state.index;
    const order=state.runOrder.slice();
    const curPos=order.indexOf(current), targetPos=order.indexOf(i);
    if(curPos>=0) order.splice(curPos,1);
    const newTargetPos=order.indexOf(i);
    order.splice(newTargetPos+1,0,current);
    state.runOrder=order;
    state.index=i;
    state.activeTaskId=t._id;
    state.paused=false;
    state.tasks[i].actualStart=state.tasks[i].actualStart||now;
    state.tasks[i].actualEnd=null;
    state.remaining=Object.prototype.hasOwnProperty.call(state.taskRemaining,i)
      ? Math.max(0,state.taskRemaining[i]) : t.duration*60;
    state.taskRemaining[i]=state.remaining;

    let cursor=now;
    state.runOrder.forEach(idx=>{
      const mins=(idx===state.index)
        ? Math.max(0,state.remaining/60)
        : (Object.prototype.hasOwnProperty.call(state.taskRemaining,idx)
            ? Math.max(0,state.taskRemaining[idx]/60)
            : Math.max(1,Number(state.tasks[idx].duration)||1));
      state.timeline[idx]={s:cursor,e:cursor+mins*60000,taskRef:state.tasks[idx]._id};
      cursor=state.timeline[idx].e;
    });
    state.baseEnd=state.timeline[state.index].e;
  }

  persist(); render(); showRunner();
  if(!timer) timer=setInterval(tick,250);
  tick();
}
function startRoutine(){
  if(!state.tasks.length)return alert("Add at least one task.");
  clearInterval(timer);
  state.running=true; state.paused=false; state.interruptStack=[]; state.taskRemaining={};
  state.runOrder=state.tasks.map((_,i)=>i);
  state.routineStart=Date.now();
  state.index=state.tasks.findIndex(t=>!t.done);
  if(state.index<0) state.index=0;
  state.activeTaskId=state.tasks[state.index]._id;
  state.tasks[state.index].actualStart=state.routineStart;
  state.tasks[state.index].actualEnd=null;
  state.timeline=schedule().map((x,i)=>({s:x.s,e:x.e,taskRef:state.tasks[i]._id}));
  state.remaining=Math.round((state.timeline[state.index].e-Date.now())/1000);
  state.baseEnd=state.timeline[state.index].e;
  persist(); render(); showRunner();
  timer=setInterval(tick,250);
  tick();
}
function showRunner(){ document.getElementById("runner").style.display="block"; }
function tick(){
  if(!state.running||state.paused)return;
  syncActiveIndex();
  state.remaining=Math.round((state.baseEnd-Date.now())/1000);
  let t=state.tasks[state.index];
  if(!t) return;
  document.getElementById("runTask").textContent=`${t.emoji} ${t.name}`;
  document.getElementById("clock").textContent=clock(state.remaining);
  document.getElementById("runEnd").textContent=state.remaining<0 ? `Overtime (+${clock(Math.abs(state.remaining))})` : `Ends at ${timeLabel(new Date(state.baseEnd))}`;
  if(state.remaining<0){
    shiftAllFutureTaskStartTimes(Date.now());
  }
}
function finishCurrent(){
  syncActiveIndex();
  const now=Date.now(), i=state.index, t=state.tasks[i];
  let elapsed=(t.duration*60)-state.remaining;
  t.done=true; t.actualDuration=Math.ceil(elapsed/60);
  t.dueMinutes=Math.max(0, t.actualDuration - t.duration);
  t.earlyMinutes=Math.max(0, t.duration - t.actualDuration);

  const order=Array.isArray(state.runOrder)&&state.runOrder.length===state.tasks.length?state.runOrder:state.tasks.map((_,idx)=>idx);
  let pos=order.indexOf(i), next=-1;
  for(let k=1;k<=order.length;k++){ const idx=order[(pos+k)%order.length]; if(!state.tasks[idx].done){next=idx; break;} }

  if(next<0){
    stopRoutine(); alert("Routine complete! 🎉"); return;
  }
  state.index=next;
  state.activeTaskId=state.tasks[next]._id;
  state.tasks[next].actualStart=now;
  state.tasks[next].actualEnd=null;
  state.remaining=Object.prototype.hasOwnProperty.call(state.taskRemaining,next)?Math.max(0,state.taskRemaining[next]):state.tasks[next].duration*60;
  rebuildFuture(next, now);
  state.baseEnd=state.timeline[next].e;
  persist(); render(); showRunner(); tick();
}
function doneTask(){ if(state.running) finishCurrent(); }
function togglePause(){
  if(!state.running)return;
  state.paused=!state.paused;
  document.getElementById("pauseBtn").textContent=state.paused?"Resume":"Pause";
  if(!state.paused){
    state.baseEnd=Date.now()+state.remaining*1000;
  }
  persist();
}
function adjustTime(){
  if(!state.running)return;
  syncActiveIndex();
  const input=document.getElementById("adjustMinutes");
  const delta=Number(input.value);
  if(!Number.isFinite(delta) || delta===0){alert("Enter a non-zero number of minutes.");return}
  if(!Array.isArray(state.timeline)||state.timeline.length!==state.tasks.length){
    state.timeline=buildTimeline(state.routineStart||Date.now());
  }
  const oldDuration=state.tasks[state.index].duration;
  const newDuration=Math.max(1,oldDuration + delta);
  const actualDelta=newDuration-oldDuration;
  state.tasks[state.index].duration=newDuration;
  state.tasks[state.index].allocatedDuration=newDuration;
  const ms=actualDelta*60000;
  if(state.paused){
    state.remaining=Math.max(1,state.remaining + actualDelta*60);
    state.timeline[state.index].e=state.timeline[state.index].s+state.remaining*1000;
    state.baseEnd=state.timeline[state.index].e;
  }else{
    state.baseEnd+=ms;
    state.timeline[state.index].e=state.baseEnd;
    state.remaining=Math.round((state.baseEnd-Date.now())/1000);
  }
  rebuildFuture(state.index+1,state.timeline[state.index].e);
  persist(); render(); tick();
}
function interruptTask(){
  if(!state.running)return;
  syncActiveIndex();
  let choices=state.tasks.map((t,i)=>({t,i})).filter(x=>!x.t.done && x.i!==state.index);
  if(!choices.length)return alert("No other unfinished tasks.");
  let list=choices.map((x,n)=>`${n+1}. ${x.t.emoji} ${x.t.name}`).join("\n");
  let ans=prompt("Switch to task number:\n\n"+list);
  if(!ans)return;
  let idx=Number(ans)-1;
  if(choices[idx]) startTask(choices[idx].i);
}
function skipTask(){ if(state.running) finishCurrent(); }
function stopRoutine(){
  clearInterval(timer); timer=null; state.running=false; state.paused=false; state.activeTaskId=null;
  persist(); document.getElementById("runner").style.display="none"; render();
}

async function init(){
  try{
    const dbLists=await readSavedListsDB();
    if(dbLists && Object.keys(dbLists).length){
      state.savedLists={...dbLists, ...state.savedLists};
    }
  }catch(e){}
  setTheme(state.theme || "dark");
  populateSavedLists();
  render();
  if(state.running && state.index < state.tasks.length){
    showRunner();
    timer=setInterval(timer,250); // Fallback safe interval check
    timer=setInterval(tick,250);
  }
}
init();
</script>
